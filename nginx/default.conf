# Reverse proxy that exposes only the "demo" project of the Document API.
# Any other path (other projects, /DEMO, /demox, /) gets 404 here and never reaches the API.

upstream document_api {
    server 127.0.0.1:5104; # Document launch profile; nginx runs with --network host (see scripts.sh)
}

server {
    listen 5105;

    # Match Kestrel's default request body limit (~28.6 MB); nginx's own default is only 1 MB.
    client_max_body_size 30m;

    # A proxy_pass WITH a URI part makes nginx replace the matched prefix in the *normalized*
    # request URI, so the API always receives "/demo..." — tricks like /demo/../crm or
    # /demo/%2e%2e/crm are resolved by nginx first (to /crm) and fall through to the 404 below.
    location = /demo {
        proxy_pass http://document_api/demo;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /demo/ {
        proxy_pass http://document_api/demo/;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location / {
        return 404;
    }
}
